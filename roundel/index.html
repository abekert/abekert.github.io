                data-menu="background"
                type="button"
                aria-controls="menu-background"
                aria-expanded="false"
                aria-label="Open background options"
              ></button>
              <button
                class="hotspot hotspot-ring"
                data-menu="ring"
                type="button"
                aria-controls="menu-ring"
                aria-expanded="false"
                aria-label="Open colour and ring options"
              ></button>
              <button
                class="bar-grip bar-grip-left"
                data-menu="bar"
                data-drag="width-left"
                type="button"
                aria-controls="menu-bar"
                aria-expanded="false"
                aria-label="Adjust bar width"
              ></button>
              <button
                class="bar-grip bar-grip-right"
                data-menu="bar"
                data-drag="width-right"
                type="button"
                aria-controls="menu-bar"
                aria-expanded="false"
                aria-label="Adjust bar width"
              ></button>
              <button
                class="bar-grip bar-grip-top bar-grip-thickness"
                data-menu="bar"
                data-drag="height-top"
                type="button"
                aria-controls="menu-bar"
                aria-expanded="false"
                aria-label="Adjust bar thickness"
              ></button>
              <button
                class="bar-grip bar-grip-bottom bar-grip-thickness"
                data-menu="bar"
                data-drag="height-bottom"
                type="button"
                aria-controls="menu-bar"
                aria-expanded="false"
                aria-label="Adjust bar thickness"
              ></button>
              <textarea
                class="live-text-editor"
                id="sign-text"
                name="sign-text"
                rows="2"
                maxlength="64"
                autocomplete="off"
                spellcheck="false"
                aria-label="Sign text"
              >UNDERGROUND</textarea>
              <div class="drag-readout" id="drag-readout" aria-hidden="true"></div>

              <div class="floating-menu menu-ring" id="menu-ring" data-menu-panel="ring" role="dialog" aria-label="Roundel colours" hidden>
                <div class="menu-title">Colours</div>
                <div class="color-grid" aria-label="Colour styles">
                  <button class="color-button" data-color="preset" type="button" style="--ring: #d61920; --bar: #0019a8; --text-on: #ffffff;">Preset</button>
                  <button class="color-button" data-color="underground" type="button" style="--ring: #e1251b; --bar: #003688; --text-on: #ffffff;">Underground</button>
                  <button class="color-button" data-color="rail" type="button" style="--ring: #001f7e; --bar: #003688; --text-on: #ffffff;">TfL Rail</button>
                  <button class="color-button" data-color="elizabeth" type="button" style="--ring: #7156b8; --bar: #003688; --text-on: #ffffff;">Elizabeth</button>
                  <button class="color-button" data-color="overground" type="button" style="--ring: #ef7b10; --bar: #003688; --text-on: #ffffff;">Overground</button>
                  <button class="color-button" data-color="dlr" type="button" style="--ring: #00a4a7; --bar: #003688; --text-on: #ffffff;">DLR</button>
                  <button class="color-button" data-color="river" type="button" style="--ring: #009bd8; --bar: #003688; --text-on: #ffffff;">River</button>
                  <button class="color-button" data-color="trams" type="button" style="--ring: #84bd00; --bar: #003688; --text-on: #ffffff;">Trams</button>
                  <button class="color-button" data-color="buses" type="button" style="--ring: #e1251b; --bar: #e1251b; --text-on: #ffffff;">Buses</button>
                  <button class="color-button" data-color="coaches" type="button" style="--ring: #fdb913; --bar: #003688; --text-on: #ffffff;">Coaches</button>
                  <button class="color-button" data-color="cycles" type="button" style="--ring: #e1251b; --bar: #ffffff; --text-on: #e1251b;">Cycles</button>
                  <button class="color-button" data-color="dial" type="button" style="--ring: #b23a96; --bar: #003688; --text-on: #ffffff;">Dial</button>
                  <button class="color-button" data-color="taxi" type="button" style="--ring: #7c8bc5; --bar: #003688; --text-on: #ffffff;">Taxi</button>
                  <button class="color-button" data-color="airline" type="button" style="--ring: #ffffff; --bar: #ffffff; --text-on: #e4002b;">Airline</button>
                </div>
                <div class="toggle-grid">
                  <label class="toggle" for="white-center">
                    <input id="white-center" name="white-center" type="checkbox" checked />
                    <span>Center fill</span>
                  </label>
                  <label class="toggle" for="use-gradients">
                    <input id="use-gradients" name="use-gradients" type="checkbox" checked />
                    <span>Gradients</span>
                  </label>
                  <label class="toggle" for="use-shadow">
                    <input id="use-shadow" name="use-shadow" type="checkbox" checked />
                    <span>Shadow</span>
                  </label>
                </div>
              </div>

              <div class="floating-menu menu-bar" id="menu-bar" data-menu-panel="bar" role="dialog" aria-label="Bar options" hidden>
                <div class="menu-title">Bar</div>
                <label class="range-field" for="bar-width">
                  <span>Width</span>
                  <div class="range-row">
                    <input id="bar-width" name="bar-width" type="range" min="280" max="1040" step="10" value="900" />
                    <output id="bar-width-output" for="bar-width">900</output>
                  </div>
                </label>
                <label class="range-field" for="bar-height-adjust">
                  <span>Thickness</span>
                  <div class="range-row">
                    <input id="bar-height-adjust" name="bar-height-adjust" type="range" min="-28" max="36" step="2" value="0" />
                    <output id="bar-height-output" for="bar-height-adjust">0</output>
                  </div>
                </label>
                <div class="toggle-grid">
                  <label class="toggle" for="blue-outline">
                    <input id="blue-outline" name="blue-outline" type="checkbox" checked />
                    <span>Bar outline</span>
                  </label>
                  <label class="toggle" for="white-inset">
                    <input id="white-inset" name="white-inset" type="checkbox" checked />
                    <span>White inset</span>
                  </label>
                </div>
              </div>

              <div class="floating-menu menu-font" id="menu-font" data-menu-panel="font" role="dialog" aria-label="Font options" hidden>
                <div class="menu-title">Font</div>
                <div class="font-grid" aria-label="Font styles">
                  <button class="font-button" data-font="gill" type="button">Gill Sans</button>
                  <button class="font-button" data-font="avenir" type="button">Avenir</button>
                  <button class="font-button" data-font="trebuchet" type="button">Trebuchet</button>
                  <button class="font-button" data-font="system" type="button">System</button>
                  <button class="font-button" data-font="rounded" type="button">Rounded</button>
                </div>
              </div>

              <div class="floating-menu menu-text-size" id="menu-text-size" data-menu-panel="text-size" role="dialog" aria-label="Text size options" hidden>
                <div class="menu-title">Size</div>
                <label class="range-field" for="text-size-adjust">
                  <span>Text size</span>
                  <div class="range-row">
                    <input id="text-size-adjust" name="text-size-adjust" type="range" min="-14" max="14" step="1" value="0" />
                    <output id="text-size-output" for="text-size-adjust">0</output>
                  </div>
                </label>
              </div>

              <div class="floating-menu menu-text-case" id="menu-text-case" data-menu-panel="text-case" role="dialog" aria-label="Text case options" hidden>
                <div class="menu-title">Case</div>
                <div class="toggle-grid">
                  <label class="toggle toggle-wide" for="capitalise-text">
                    <input id="capitalise-text" name="capitalise-text" type="checkbox" checked />
                    <span>CAPITALISE</span>
                  </label>
                </div>
              </div>

              <div class="floating-menu menu-background" id="menu-background" data-menu-panel="background" role="dialog" aria-label="Background options" hidden>
                <div class="menu-title">Surface</div>
                <label class="toggle toggle-wide" for="use-plaque">
                  <input id="use-plaque" name="use-plaque" type="checkbox" />
                  <span>Signboard background</span>
                </label>
                <button class="menu-action" data-export type="button">Export PNG</button>
                <button class="menu-action menu-action-secondary" data-export-svg type="button">Export SVG</button>
                <button class="menu-action menu-action-secondary" data-copy-link type="button">Copy link</button>
              </div>
            </div>
          </div>

          <div class="style-strip" aria-label="Ready-made roundel styles">
            <button class="style-button" data-preset="enamel" type="button" style="--mini-ring: #d61920; --mini-bar: #0019a8; --mini-hole: #ffffff;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Enamel</span>
            </button>
            <button class="style-button" data-preset="classic" type="button" style="--mini-ring: #dc241f; --mini-bar: #0019a8; --mini-hole: #ffffff;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Classic</span>
            </button>
            <button class="style-button" data-preset="platform" type="button" style="--mini-ring: #e94b55; --mini-bar: #394579; --mini-hole: #eef3f6;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Platform</span>
            </button>
            <button class="style-button" data-preset="heritage" type="button" style="--mini-ring: #cf130f; --mini-bar: #071454; --mini-hole: #efe8c9;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Heritage</span>
            </button>
            <button class="style-button" data-preset="redDisc" type="button" style="--mini-ring: #dc241f; --mini-bar: #12205f; --mini-hole: #dc241f;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Red disc</span>
            </button>
            <button class="style-button" data-preset="museum" type="button" style="--mini-ring: #b81613; --mini-bar: #10173d; --mini-hole: #f5f0de;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Museum</span>
            </button>
            <button class="style-button" data-preset="poster" type="button" style="--mini-ring: #c92d2a; --mini-bar: #003688; --mini-hole: #fffaf0;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Poster</span>
            </button>
            <button class="style-button" data-preset="night" type="button" style="--mini-ring: #d71920; --mini-bar: #061da9; --mini-hole: #ffffff;">
              <span class="style-mini" aria-hidden="true"><span></span></span>
              <span>Night</span>
            </button>
            <button class="style-button" data-preset="neon" type="button" style="--mini-ring: #ff4b2b; --mini-bar: #1024d6; --mini-hole: #ff4b2b; --mini-glow: #68f8ff;">
              <span class="style-mini style-mini-neon" aria-hidden="true"><span></span></span>
              <span>Neon</span>
            </button>
            <button class="style-button" data-preset="halogen" type="button" style="--mini-ring: #c91e17; --mini-bar: #071454; --mini-hole: #fff3d7; --mini-glow: #ffc86d;">
              <span class="style-mini style-mini-halogen" aria-hidden="true"><span></span></span>
              <span>Halogen</span>
            </button>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
